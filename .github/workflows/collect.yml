name: Update repo lists

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Debug - Check API keys
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS_ROUTER: ${{ secrets.MODELS_ROUTER }}
        run: |
          echo "🔍 Проверка переменных окружения..."
          echo "GITHUB_TOKEN установлен: $([ -n "$GITHUB_TOKEN" ] && echo 'ДА' || echo 'НЕТ')"
          echo "MODELS_ROUTER установлен: $([ -n "$MODELS_ROUTER" ] && echo 'ДА' || echo 'НЕТ')"
          
          if [ -n "$MODELS_ROUTER" ]; then
            echo "Длина MODELS_ROUTER: ${#MODELS_ROUTER}"
            echo "Первые 10 символов: ${MODELS_ROUTER:0:10}"
            echo "Последние 4 символа: ${MODELS_ROUTER: -4}"
            
            if [[ "$MODELS_ROUTER" == gsk_* ]]; then
              echo "✅ Формат ключа правильный (начинается с gsk_)"
            else
              echo "❌ ВНИМАНИЕ: Ключ не начинается с gsk_ - возможно, это неправильный ключ!"
            fi
          else
            echo "❌ MODELS_ROUTER пустой или не установлен!"
          fi

      - name: Run search script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS_ROUTER: ${{ secrets.MODELS_ROUTER }}
        run: python scripts/github_search.py

      - name: Check if files changed
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "::notice::No changes detected, skipping commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected, preparing commit"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Автообновление списков репозиториев [auto]"
          file_pattern: "README.md links/*.md data/**/*.json translation_cache.json"
